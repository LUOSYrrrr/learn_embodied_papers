<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1675" viewBox="0 0 1200 1675" role="img" aria-labelledby="title desc">
<title id="title">EgoHumanoid-V2 全流程：采集、离线制数、训练、部署</title><desc id="desc">解释图，非论文原图。离线制数也执行 SONIC 仿真；最终部署不运行 K 加八轮 D。附录 online IK 是独立对照而非主方法。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="1675" fill="#ffffff"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif" fill="#152334">
<text x="45" y="43" text-anchor="start" font-size="29" font-weight="700"><tspan x="45" dy="0">EgoHumanoid-V2：四个阶段，不是一个网络端到端包办</tspan></text>
<text x="45" y="76" text-anchor="start" font-size="17" font-weight="400"><tspan x="45" dy="0">解释图，非论文原图 · 来源 §3、Appendices A–B、D · 同一 SONIC checkpoint 用于对齐与部署</tspan></text>
<rect x="25" y="95" width="1150" height="175" rx="15" fill="#eaf3ff" stroke="#cbd5e1"/><text x="49" y="129" text-anchor="start" font-size="23" font-weight="700"><tspan x="49" dy="0">01 人体采集 · 没有机器人遥操作</tspan></text><rect x="25" y="300" width="1150" height="610" rx="15" fill="#fff6e5" stroke="#cbd5e1"/><text x="49" y="334" text-anchor="start" font-size="23" font-weight="700"><tspan x="49" dy="0">02 离线制作训练数据</tspan></text><rect x="25" y="935" width="1150" height="280" rx="15" fill="#f0eefe" stroke="#cbd5e1"/><text x="49" y="969" text-anchor="start" font-size="23" font-weight="700"><tspan x="49" dy="0">03 训练任务专用 VLA</tspan></text><rect x="25" y="1240" width="1150" height="295" rx="15" fill="#eaf7f0" stroke="#cbd5e1"/><text x="49" y="1274" text-anchor="start" font-size="23" font-weight="700"><tspan x="49" dy="0">04 真机部署 · 闭环执行</tspan></text>
<path d="M385 235 L385 395" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M950 235 L950 395" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M385 465 L385 505" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M385 590 L385 630" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M385 725 L385 765" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M1140 195 L1160 195 L1160 677 L1140 677" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M385 850 L385 990" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M950 540 L735 540 L735 890 L950 890 L950 990" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M950 725 L950 990" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M600 1065 L600 1110" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M470 1180 L470 1330" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M320 1382 L365 1382" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M575 1382 L620 1382" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M870 1382 L915 1382" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M1028 1435 L1028 1490 L190 1490 L190 1435" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><text x="600" y="1478" text-anchor="middle" font-size="18" font-weight="400"><tspan x="600" dy="0">下一次观测 / 自身状态反馈</tspan></text>
<rect x="60" y="155" width="1080" height="80" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="600" y="187.5" text-anchor="middle" font-size="21" font-weight="400"><tspan x="600" dy="0">人完成任务：PICO 记录身体 / 手部运动，GoPro 记录第一人称 RGB</tspan><tspan x="600" dy="29">同步记录 → 人体运动、手姿态、RGB；再配任务语言指令</tspan></text><rect x="60" y="395" width="650" height="70" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="385" y="422.5" text-anchor="middle" font-size="21" font-weight="400"><tspan x="385" dy="0">H · 人体运动 → SONIC 仿真 rollout</tspan><tspan x="385" dy="29">得到初始机器人关节轨迹、token 与骨盆高度</tspan></text><rect x="60" y="505" width="650" height="85" rx="9" fill="#fff1d8" stroke="#94a3b8" stroke-width="1.5"/><text x="385" y="540" text-anchor="middle" font-size="21" font-weight="400"><tspan x="385" dy="0">构造固定手 / 脚目标（含骨盆高度配准）</tspan><tspan x="385" dy="29">K · offline IK 改关节参考 → 编码为 SONIC token</tspan></text><rect x="60" y="630" width="650" height="95" rx="9" fill="#fff1d8" stroke="#94a3b8" stroke-width="1.5"/><text x="385" y="655.5" text-anchor="middle" font-size="21" font-weight="400"><tspan x="385" dy="0">D · 冻结 decoder + MLP，优化 SONIC token</tspan><tspan x="385" dy="29">仿真 replay → 测执行残差 → 更新 context → 再优化</tspan><tspan x="385" dy="29">默认：7 轮常规 D + 1 轮保守 D</tspan></text><rect x="60" y="765" width="650" height="85" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="385" y="800" text-anchor="middle" font-size="21" font-weight="400"><tspan x="385" dy="0">历史候选选择 + 独立 replay 验收</tspan><tspan x="385" dy="29">保留通过验证的 token / 机器人状态；失败候选不直接入库</tspan></text><rect x="760" y="395" width="380" height="145" rx="9" fill="#eaf3ff" stroke="#94a3b8" stroke-width="1.5"/><text x="950" y="431" text-anchor="middle" font-size="21" font-weight="400"><tspan x="950" dy="0">RGB 视觉对齐</tspan><tspan x="950" dy="29">遮掉人体前臂与腕部 tracker</tspan><tspan x="950" dy="29">补全背景 → 渲染机器人臂</tspan><tspan x="950" dy="29">训练时再做图像增强</tspan></text><rect x="760" y="630" width="380" height="95" rx="9" fill="#eaf3ff" stroke="#94a3b8" stroke-width="1.5"/><text x="950" y="655.5" text-anchor="middle" font-size="21" font-weight="400"><tspan x="950" dy="0">手姿态重定向</tspan><tspan x="950" dy="29">人体手 → 左右 Revo2 手命令</tspan><tspan x="950" dy="29">每手 6 维</tspan></text><rect x="60" y="990" width="1080" height="75" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="600" y="1020" text-anchor="middle" font-size="21" font-weight="400"><tspan x="600" dy="0">同步成监督样本：图像 + 43 维机器人状态 + 语言 → 76 维动作</tspan><tspan x="600" dy="29">动作 = 64 维 SONIC token + 左手 6 维 + 右手 6 维；状态来自验收 replay</tspan></text><rect x="60" y="1110" width="1080" height="70" rx="9" fill="#f0eefe" stroke="#94a3b8" stroke-width="1.5"/><text x="600" y="1137.5" text-anchor="middle" font-size="21" font-weight="400"><tspan x="600" dy="0">以预训练 π₀.₅ 为起点，每个任务各自 post-train 一份策略</tspan><tspan x="600" dy="29">训练 VLA 参数；不把 SONIC / 响应 MLP 当作一起端到端训练的新模型</tspan></text><rect x="60" y="1330" width="260" height="105" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="190" y="1360.5" text-anchor="middle" font-size="20" font-weight="400"><tspan x="190" dy="0">真实观测</tspan><tspan x="190" dy="29">机器人 GoPro RGB</tspan><tspan x="190" dy="29">机器人状态 + 指令</tspan></text><rect x="365" y="1330" width="210" height="105" rx="9" fill="#f0eefe" stroke="#94a3b8" stroke-width="1.5"/><text x="470" y="1360.5" text-anchor="middle" font-size="20" font-weight="400"><tspan x="470" dy="0">训练好的 VLA</tspan><tspan x="470" dy="29">预测动作序列</tspan><tspan x="470" dy="29">token + 双手命令</tspan></text><rect x="620" y="1330" width="250" height="105" rx="9" fill="#fff1d8" stroke="#94a3b8" stroke-width="1.5"/><text x="745" y="1360.5" text-anchor="middle" font-size="20" font-weight="400"><tspan x="745" dy="0">身体 token → SONIC</tspan><tspan x="745" dy="29">双手命令 → Revo2</tspan><tspan x="745" dy="29">不是运行 K + 8D</tspan></text><rect x="915" y="1330" width="225" height="105" rx="9" fill="#eaf7f0" stroke="#94a3b8" stroke-width="1.5"/><text x="1027.5" y="1360.5" text-anchor="middle" font-size="20" font-weight="400"><tspan x="1027.5" dy="0">G1 实际执行</tspan><tspan x="1027.5" dy="29">身体 + 双手</tspan><tspan x="1027.5" dy="29">与环境交互</tspan></text>
<text x="950" y="570" text-anchor="middle" font-size="17" font-weight="400"><tspan x="950" dy="0">准备：SONIC 已预训练</tspan><tspan x="950" dy="29">MLP 用仿真干预数据另训</tspan></text>
<rect x="25" y="1560" width="1150" height="90" rx="12" fill="#fff3f2" stroke="#e5aaa4"/>
<text x="600" y="1594" text-anchor="middle" font-size="22" font-weight="700"><tspan x="600" dy="0">附录 D 的独立对照（不是上面的主部署流程）</tspan></text>
<text x="600" y="1626" text-anchor="middle" font-size="20" font-weight="400"><tspan x="600" dy="0">SONIC 关节命令 → online IK 覆盖 / 叠加部分关节 → 仿真执行；比较精度与稳定性</tspan></text>
</g></svg>
