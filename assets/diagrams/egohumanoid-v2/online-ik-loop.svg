<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1465" viewBox="0 0 1200 1465" role="img" aria-labelledby="title desc"><title id="title">附录 D：online IK 如何接入 SONIC 执行环</title><desc id="desc">解释图，非论文原图。两条命令分支在发送前组合，不是修改参考后重新编码 token。机器人执行反馈回到后续控制；三种组合未能稳定跟踪。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="1200" height="1465" fill="white"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif" fill="#152334">
<text x="45" y="43" text-anchor="start" font-size="30" font-weight="700"><tspan x="45" dy="0">Online IK：在执行当下，组合两套关节命令</tspan></text><text x="45" y="73" text-anchor="start" font-size="17" font-weight="400"><tspan x="45" dy="0">解释性接线图 · 对应 Appendix D，不是 VLA 推理图；完整软件调度与反馈字段未逐项公开</tspan></text>
<path d="M215 205 L215 285" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M595 205 L595 335 L560 335" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M595 205 L595 335 L680 335" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M980 205 L980 245 L910 245 L910 285" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M310 385 L310 445" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M910 385 L910 445" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M310 530 L310 575 L400 575 L400 620" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M910 530 L910 575 L800 575 L800 620" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M600 725 L600 820" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M600 905 L600 990" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M980 1037 L1170 1037 L1170 85 L595 85 L595 110" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="60" y="110" width="310" height="95" rx="12" fill="#eaf3ff" stroke="#94a3b8" stroke-width="1.5"/><text x="215" y="149.5" text-anchor="middle" font-size="23" font-weight="400"><tspan x="215" dy="0">给定运动轨迹的</tspan><tspan x="215" dy="32">SONIC token zₜ</tspan></text><rect x="440" y="110" width="310" height="95" rx="12" fill="#eaf3ff" stroke="#94a3b8" stroke-width="1.5"/><text x="595" y="149.5" text-anchor="middle" font-size="23" font-weight="400"><tspan x="595" dy="0">当前机器人反馈</tspan><tspan x="595" dy="32">姿态 / 控制状态</tspan></text><rect x="820" y="110" width="320" height="95" rx="12" fill="#eaf3ff" stroke="#94a3b8" stroke-width="1.5"/><text x="980" y="149.5" text-anchor="middle" font-size="23" font-weight="400"><tspan x="980" dy="0">当前帧的</tspan><tspan x="980" dy="32">手 / 脚目标</tspan></text><rect x="60" y="285" width="500" height="100" rx="12" fill="#f0eefe" stroke="#94a3b8" stroke-width="1.5"/><text x="310" y="327" text-anchor="middle" font-size="21" font-weight="400"><tspan x="310" dy="0">SONIC 控制器</tspan><tspan x="310" dy="32">结合 token 与自身反馈，产生协调身体命令</tspan></text><rect x="680" y="285" width="460" height="100" rx="12" fill="#fff1d8" stroke="#94a3b8" stroke-width="1.5"/><text x="910" y="327" text-anchor="middle" font-size="21" font-weight="400"><tspan x="910" dy="0">在线 IK 求解</tspan><tspan x="910" dy="32">根据末端目标与几何，求指定关节目标</tspan></text><rect x="60" y="445" width="500" height="85" rx="12" fill="#f0eefe" stroke="#94a3b8" stroke-width="1.5"/><text x="310" y="479.5" text-anchor="middle" font-size="21" font-weight="400"><tspan x="310" dy="0">SONIC 原本要发送的</tspan><tspan x="310" dy="32">身体关节目标 uˢ</tspan></text><rect x="680" y="445" width="460" height="85" rx="12" fill="#fff1d8" stroke="#94a3b8" stroke-width="1.5"/><text x="910" y="479.5" text-anchor="middle" font-size="21" font-weight="400"><tspan x="910" dy="0">IK 给出的替代关节目标 uᴵᴷ</tspan><tspan x="910" dy="32">不是重新编码得到的新 SONIC token</tspan></text><rect x="220" y="620" width="760" height="105" rx="12" fill="#ffe5df" stroke="#94a3b8" stroke-width="1.5"/><text x="600" y="664.5" text-anchor="middle" font-size="21" font-weight="400"><tspan x="600" dy="0">关键：按 A / B / C 规则组合关节命令</tspan><tspan x="600" dy="32">部分关节用 IK，其他关节保留 SONIC；B 再加平衡贡献</tspan></text><rect x="220" y="820" width="760" height="85" rx="12" fill="#eaf7f0" stroke="#94a3b8" stroke-width="1.5"/><text x="600" y="854.5" text-anchor="middle" font-size="21" font-weight="400"><tspan x="600" dy="0">发送组合后的关节目标 → 仿真机器人执行</tspan><tspan x="600" dy="32">这里已经不是原封不动的 SONIC 输出</tspan></text><rect x="220" y="990" width="760" height="95" rx="12" fill="#eaf7f0" stroke="#94a3b8" stroke-width="1.5"/><text x="600" y="1029.5" text-anchor="middle" font-size="21" font-weight="400"><tspan x="600" dy="0">测量实际身体状态与手 / 脚位置</tspan><tspan x="600" dy="32">记录末端误差、身体倾角、初始化摔倒与 fall events</tspan></text>
<text x="630" y="778" text-anchor="start" font-size="20" font-weight="600"><tspan x="630" dy="0">直接改变发送的关节目标</tspan></text><text x="630" y="955" text-anchor="start" font-size="20" font-weight="600"><tspan x="630" dy="0">物理响应 ≠ IK 数学解</tspan></text>
<text x="1136" y="680" text-anchor="end" font-size="18" font-weight="400"><tspan x="1136" dy="0">反馈进入下一时刻</tspan></text>
<rect x="60" y="1145" width="1080" height="200" rx="12" fill="#f5f7fa" stroke="#cbd5e1"/>
<text x="85" y="1181" text-anchor="start" font-size="23" font-weight="700"><tspan x="85" dy="0">三种接法（Table 11）</tspan></text>
<text x="85" y="1225" text-anchor="start" font-size="21" font-weight="400"><tspan x="85" dy="0">A：手任务 IK 改手臂+腰；脚任务改双腿；其他关节用 SONIC。</tspan></text>
<text x="85" y="1270" text-anchor="start" font-size="21" font-weight="400"><tspan x="85" dy="0">B：与 A 相同，再加入 SONIC 的 balance contribution。</tspan></text>
<text x="85" y="1315" text-anchor="start" font-size="21" font-weight="400"><tspan x="85" dy="0">C：手任务只改手臂；脚任务只改右腿；其他关节用 SONIC。</tspan></text>
<text x="60" y="1386" text-anchor="start" font-size="21" font-weight="700"><tspan x="60" dy="0">与 offline K 的分叉：K 改参考 → 编码 token → 经 SONIC 执行；这里改的是执行命令。</tspan></text>
<text x="60" y="1423" text-anchor="start" font-size="20" font-weight="400"><tspan x="60" dy="0">注意：仍有反馈不代表必然稳定；这是 60 次仿真诊断，并非论文主方法的真机部署链。</tspan></text>
</g></svg>
